<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Multiple AI — Best answer from every model</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #080a0f;
      --surface: #0f1117;
      --surface-2: #161b27;
      --surface-3: #1c2333;
      --border: #1e2740;
      --border-2: #2a3550;
      --text: #f0f4ff;
      --text-2: #b8c8e8;
      --text-3: #8a9dbf;
      --accent: #6366f1;
      --accent-glow: rgba(99,102,241,.25);
      --accent-2: #22d3ee;
      --winner: #10b981;
      --winner-glow: rgba(16,185,129,.2);
      --error: #ef4444;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(0,0,0,.5);
    }
    html.light {
      --bg: #f1f5fb;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --surface-3: #eef2f8;
      --border: #dde3f0;
      --border-2: #c5cfe8;
      --text: #0f172a;
      --text-2: #3d4f70;
      --text-3: #7a8fb0;
      --accent-glow: rgba(99,102,241,.15);
      --winner-glow: rgba(16,185,129,.1);
      --shadow: 0 4px 24px rgba(0,0,0,.07);
    }
    html.light body::before {
      background:
        radial-gradient(ellipse 80% 50% at 70% -10%, rgba(99,102,241,.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at -10% 80%, rgba(34,211,238,.04) 0%, transparent 60%);
    }
    html.light .best-body { color: #064e3b; }
    html.light .rationale { color: #065f46; }
    html.light .rationale strong { color: #047857; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      font-size: 15px; line-height: 1.6; min-height: 100vh;
      transition: background .2s, color .2s;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 70% -10%, rgba(99,102,241,.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at -10% 80%, rgba(34,211,238,.07) 0%, transparent 60%);
    }
    .wrap {
      position: relative; z-index: 1;
      max-width: 860px; margin: 0 auto; padding: 36px 20px 80px;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; margin-bottom: 32px;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .brand-icon {
      width: 34px; height: 34px; border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; box-shadow: 0 0 20px var(--accent-glow); flex-shrink: 0;
    }
    .brand-name { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .brand-sub { font-size: 11px; color: var(--text-3); letter-spacing: .05em; text-transform: uppercase; font-weight: 500; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .providers-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--border);
      padding: 5px 12px; border-radius: 999px; font-size: 12px; color: var(--text-2);
    }
    .providers-pill .dot { color: var(--winner); font-size: 10px; }
    .providers-pill .dot.err { color: var(--error); }
    a.nav-link, button.nav-link {
      font-size: 12px; color: var(--text-3); text-decoration: none;
      padding: 5px 12px; border: 1px solid var(--border);
      border-radius: 999px; background: var(--surface);
      transition: color .15s, border-color .15s;
      cursor: pointer; font-family: inherit;
    }
    a.nav-link:hover, button.nav-link:hover { color: var(--text); border-color: var(--border-2); }

    /* ── Ask card ── */
    .ask-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px;
      box-shadow: var(--shadow); margin-bottom: 28px;
    }
    .ask-card h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.025em; margin-bottom: 4px; }
    .ask-card p { font-size: 13px; color: var(--text-2); margin-bottom: 18px; }
    .input-row { display: flex; gap: 10px; align-items: flex-end; }
    textarea {
      flex: 1; min-height: 88px; resize: vertical;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 12px 14px; font-size: 14px; line-height: 1.5;
      font-family: inherit; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    textarea::placeholder { color: var(--text-3); }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .btn-ask {
      background: linear-gradient(135deg, var(--accent) 0%, #818cf8 100%);
      color: #fff; border: none; padding: 0 22px; height: 44px;
      border-radius: var(--radius-sm); font-weight: 600; font-size: 14px;
      cursor: pointer; white-space: nowrap;
      box-shadow: 0 2px 12px var(--accent-glow);
      transition: filter .15s, transform .08s;
    }
    .btn-ask:hover { filter: brightness(1.1); }
    .btn-ask:active { transform: translateY(1px); }
    .btn-ask:disabled { opacity: .5; cursor: not-allowed; filter: none; transform: none; }
    .hint { margin-top: 8px; font-size: 12px; color: var(--text-3); }
    .hint kbd {
      background: var(--surface-3); border: 1px solid var(--border-2);
      border-radius: 4px; padding: 1px 5px; font-size: 11px;
    }
    .toast {
      margin-top: 12px; padding: 10px 14px; border-radius: var(--radius-sm);
      font-size: 13px; background: rgba(239,68,68,.1); color: #fca5a5;
      border: 1px solid rgba(239,68,68,.25);
    }

    /* ── History ── */
    .history-wrap { margin-top: 16px; display: none; }
    .history-wrap.show { display: block; }
    .history-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
    }
    .history-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
      color: var(--text-3); font-weight: 600;
    }
    .btn-clear-history {
      font-size: 11px; color: var(--text-3); background: none; border: none;
      cursor: pointer; padding: 0; font-family: inherit; transition: color .15s;
    }
    .btn-clear-history:hover { color: var(--error); }
    .history-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .history-item {
      font-size: 12px; padding: 4px 12px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 999px; cursor: pointer; color: var(--text-2);
      transition: border-color .15s, color .15s;
      max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .history-item:hover { border-color: var(--accent); color: var(--text); }

    /* ── Results ── */
    .results { display: flex; flex-direction: column; gap: 14px; }

    /* Per-provider loading skeletons */
    .loading-providers { display: flex; flex-direction: column; gap: 10px; }
    .loading-provider-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 18px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .loading-provider-name { font-weight: 600; font-size: 14px; color: var(--text-2); }
    .loading-status { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }

    /* ── Best card ── */
    .best-card {
      background: linear-gradient(135deg, rgba(16,185,129,.08) 0%, rgba(16,185,129,.03) 100%);
      border: 1px solid rgba(16,185,129,.3);
      border-radius: var(--radius); padding: 24px;
      box-shadow: 0 4px 32px var(--winner-glow);
    }
    .best-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .best-header-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .best-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; text-transform: uppercase; letter-spacing: .12em;
      font-weight: 700; color: var(--winner);
    }
    .best-badge svg { width: 13px; height: 13px; fill: currentColor; }
    .best-provider-tag {
      font-size: 12px; color: var(--text-2);
      background: var(--surface-2); border: 1px solid var(--border);
      padding: 3px 10px; border-radius: 999px;
    }
    .best-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-icon {
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text-3); border-radius: var(--radius-sm);
      padding: 5px 10px; cursor: pointer; font-size: 12px;
      display: inline-flex; align-items: center; gap: 5px;
      transition: color .15s, border-color .15s; font-family: inherit;
    }
    .btn-icon:hover { color: var(--text); border-color: var(--border-2); }
    .btn-icon svg { width: 13px; height: 13px; flex-shrink: 0; }
    .btn-icon.copied { color: var(--winner); border-color: rgba(16,185,129,.4); }
    .best-question { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 14px; color: var(--text); }
    .best-body { font-size: 14px; line-height: 1.7; color: #d1fae5; }
    .rationale {
      margin-top: 16px; padding-top: 14px;
      border-top: 1px dashed rgba(16,185,129,.25);
      font-size: 12px; color: #6ee7b7;
    }
    .rationale strong { color: #a7f3d0; }

    /* ── Provider cards ── */
    details.provider-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; transition: border-color .15s;
    }
    details.provider-card:hover { border-color: var(--border-2); }
    details.provider-card[open] { box-shadow: var(--shadow); }
    details.provider-card summary {
      list-style: none; cursor: pointer; padding: 14px 18px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      user-select: none;
    }
    details.provider-card summary::-webkit-details-marker { display: none; }
    .summary-left { display: flex; align-items: center; gap: 10px; }
    .provider-name { font-weight: 600; font-size: 14px; }
    .provider-model { font-size: 12px; color: var(--text-3); font-family: ui-monospace, monospace; }
    .summary-right { display: flex; align-items: center; gap: 8px; }
    .latency { font-size: 12px; color: var(--text-3); }
    .score-tag {
      font-size: 11px; font-weight: 700; padding: 2px 8px;
      border-radius: 999px; font-variant-numeric: tabular-nums;
      background: rgba(99,102,241,.15); color: #a5b4fc;
      border: 1px solid rgba(99,102,241,.3);
    }
    .badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; padding: 3px 9px; border-radius: 999px;
    }
    .badge-winner { background: rgba(16,185,129,.15); color: var(--winner); border: 1px solid rgba(16,185,129,.3); }
    .badge-error  { background: rgba(239,68,68,.12); color: #f87171; border: 1px solid rgba(239,68,68,.25); }
    .badge-candidate { background: var(--surface-3); color: var(--text-2); border: 1px solid var(--border); }
    .chevron { width: 16px; height: 16px; color: var(--text-3); transition: transform .2s; }
    details[open] .chevron { transform: rotate(180deg); }
    .card-body {
      padding: 16px 18px; border-top: 1px solid var(--border);
      font-size: 14px; line-height: 1.7; position: relative;
    }
    .card-body.is-error { color: #f87171; }
    .card-copy { position: absolute; top: 10px; right: 12px; }
    .card-content { padding-right: 90px; }

    /* ── Markdown styles ── */
    .md-body h1,.md-body h2,.md-body h3 { font-size: 15px; font-weight: 700; margin: 14px 0 6px; color: var(--text); }
    .md-body p { margin-bottom: 10px; }
    .md-body ul,.md-body ol { padding-left: 20px; margin-bottom: 10px; }
    .md-body li { margin-bottom: 4px; }
    .md-body strong { color: var(--text); font-weight: 600; }
    .md-body code {
      background: var(--surface-3); border-radius: 4px;
      padding: 1px 6px; font-size: 13px; font-family: ui-monospace, monospace;
    }
    .md-body pre { background: var(--surface-3); border-radius: var(--radius-sm); padding: 12px 14px; overflow-x: auto; margin-bottom: 10px; }
    .md-body pre code { background: none; padding: 0; }
    .md-body blockquote { border-left: 3px solid var(--border-2); padding-left: 12px; color: var(--text-2); margin-bottom: 10px; }

    /* ── Spinner ── */
    .empty { text-align: center; color: var(--text-3); padding: 48px 16px; font-size: 14px; }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.15); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite;
      vertical-align: -3px; margin-right: 7px;
    }
    html.light .spinner { border-color: rgba(0,0,0,.1); border-top-color: var(--accent); }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    footer { margin-top: 48px; text-align: center; font-size: 12px; color: var(--text-3); }
    footer a { color: var(--text-3); text-decoration: none; }
    footer a:hover { color: var(--text-2); }

    /* ── Print / PDF ── */
    @media print {
      body::before { display: none; }
      header, .ask-card, .history-wrap, footer, .btn-icon, .card-copy { display: none !important; }
      .wrap { padding: 0; max-width: 100%; }
      .results { gap: 20px; }
      .best-card { box-shadow: none; border: 2px solid #10b981; }
      details.provider-card { display: block; box-shadow: none; }
      .card-body { display: block !important; }
      .card-content { padding-right: 0; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="brand" href="/">
      <div class="brand-icon">✦</div>
      <div>
        <div class="brand-name">Multiple AI</div>
        <div class="brand-sub">Multi-model answers</div>
      </div>
    </a>
    <div class="header-right">
      <div class="providers-pill">
        <span class="dot" id="pill-dot">●</span>
        <span id="pill-text">checking…</span>
      </div>
      <button class="nav-link" id="theme-toggle" title="Toggle dark / light mode">☀️</button>
      <a class="nav-link" href="/admin">Admin</a>
    </div>
  </header>

  <div class="ask-card">
    <h1>Ask every model. Keep the best.</h1>
    <p>Your question goes to Groq, Ollama, and Gemini simultaneously. Gemini judges and picks the strongest answer.</p>
    <div class="input-row">
      <textarea id="q" placeholder="e.g. Explain quantum entanglement in simple terms…"></textarea>
      <button class="btn-ask" id="ask-btn">Ask</button>
    </div>
    <div class="hint">Press <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to submit</div>
    <div id="toast"></div>
    <div class="history-wrap" id="history-wrap">
      <div class="history-header">
        <span class="history-label">Recent questions</span>
        <button class="btn-clear-history" id="clear-history">Clear all</button>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>

  <div class="results" id="results"></div>

  <footer>
    Built with FastAPI &amp; vanilla JS &nbsp;·&nbsp;
    <a href="/docs">API docs</a> &nbsp;·&nbsp;
    <a href="/admin">Admin</a>
  </footer>
</div>

<script>
  const $ = s => document.querySelector(s);
  const q = $("#q"), askBtn = $("#ask-btn");
  const results = $("#results"), toast = $("#toast");
  const pillDot = $("#pill-dot"), pillText = $("#pill-text");
  const historyWrap = $("#history-wrap"), historyList = $("#history-list");
  const themeToggle = $("#theme-toggle");

  // ── Marked ──
  if (window.marked) marked.setOptions({ breaks: true, gfm: true });
  function renderMd(text) {
    if (window.marked) return marked.parse(text || "");
    return (text || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function esc(s) {
    return (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ── Dark / Light theme ──
  function applyTheme(t) {
    document.documentElement.classList.toggle("light", t === "light");
    themeToggle.textContent = t === "light" ? "🌙" : "☀️";
    localStorage.setItem("ai_theme", t);
  }
  applyTheme(localStorage.getItem("ai_theme") || "dark");
  themeToggle.addEventListener("click", () => {
    applyTheme(document.documentElement.classList.contains("light") ? "dark" : "light");
  });

  // ── Question history ──
  const HIST_KEY = "ai_history", MAX_HIST = 10;
  function loadHist() { try { return JSON.parse(localStorage.getItem(HIST_KEY) || "[]"); } catch { return []; } }
  function saveHist(a) { localStorage.setItem(HIST_KEY, JSON.stringify(a)); }
  function addHist(question) {
    let a = loadHist().filter(h => h !== question);
    a.unshift(question);
    saveHist(a.slice(0, MAX_HIST));
    renderHist();
  }
  function renderHist() {
    const a = loadHist();
    if (!a.length) { historyWrap.classList.remove("show"); return; }
    historyWrap.classList.add("show");
    historyList.innerHTML = a.map((h, i) =>
      `<button class="history-item" data-idx="${i}" title="${esc(h)}">${esc(h)}</button>`
    ).join("");
    historyList.querySelectorAll(".history-item").forEach(b => {
      b.addEventListener("click", () => { q.value = a[+b.dataset.idx]; q.focus(); });
    });
  }
  $("#clear-history").addEventListener("click", () => { saveHist([]); renderHist(); });
  renderHist();

  // ── Copy to clipboard ──
  async function copyText(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
      const orig = btn.innerHTML;
      btn.innerHTML = `<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg> Copied!`;
      btn.classList.add("copied");
      setTimeout(() => { btn.innerHTML = orig; btn.classList.remove("copied"); }, 2000);
    } catch {}
  }

  // ── Export markdown ──
  function exportMarkdown(data) {
    const v = data.verdict;
    let md = `# ${data.question}\n\n`;
    md += `## ★ Best Answer — ${v.winner_label}\n\n${data.best_answer}\n\n`;
    md += `> **Why this won:** ${v.rationale}`;
    if (v.judge_provider) md += ` · Judged by ${v.judge_provider}`;
    md += `\n\n---\n\n## All Answers\n\n`;
    for (const a of data.answers) {
      md += `### ${a.label} · ${a.model} · ${a.latency_ms}ms${a.is_winner ? " ★" : ""}\n\n`;
      md += a.error ? `⚠ Error: ${a.error}\n\n` : `${a.answer}\n\n`;
    }
    const blob = new Blob([md], { type: "text/markdown" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "multiple-ai-results.md";
    a.click(); URL.revokeObjectURL(url);
  }

  // ── Health check ──
  let knownProviders = [];
  async function loadHealth() {
    try {
      const r = await fetch("/api/health");
      const d = await r.json();
      knownProviders = d.providers || [];
      if (!d.providers.length) {
        pillDot.className = "dot err"; pillText.textContent = "no providers"; return;
      }
      pillText.textContent = d.providers.map(p => p.label).join(" · ");
    } catch { pillDot.className = "dot err"; pillText.textContent = "offline"; }
  }

  // ── Loading state with per-provider spinners ──
  function setLoading(on) {
    askBtn.disabled = on;
    askBtn.innerHTML = on ? '<span class="spinner"></span>Thinking…' : "Ask";
    if (on) {
      const names = knownProviders.length
        ? knownProviders
        : [{ label: "Groq" }, { label: "Ollama" }, { label: "Gemini" }];
      results.innerHTML = `<div class="loading-providers">` +
        names.map(p => `
          <div class="loading-provider-card">
            <span class="loading-provider-name">${esc(p.label)}</span>
            <span class="loading-status"><span class="spinner"></span>waiting for response…</span>
          </div>`).join("") +
        `</div>`;
    }
  }

  // ── Render results ──
  let lastData = null;
  function renderResponse(data) {
    lastData = data;
    const v = data.verdict;
    const judgeNote = v.judge_provider ? ` · Judged by <strong>${esc(v.judge_provider)}</strong>.` : "";

    // SVG icons
    const iconCopy = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="9" height="9" rx="2"/><path d="M5 12H4a2 2 0 01-2-2V4a2 2 0 012-2h6a2 2 0 012 2v1"/></svg>`;
    const iconMd   = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="16" height="12" rx="2"/><path d="M6 12V8l2 2 2-2v4M13 12V8M15 10h-2"/></svg>`;
    const iconPdf  = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 2h7l4 4v12a1 1 0 01-1 1H5a1 1 0 01-1-1V3a1 1 0 011-1z"/><path d="M12 2v4h4M7 11h2a1 1 0 000-2H7v4m4-2h2"/></svg>`;

    results.innerHTML = `
      <div class="best-card">
        <div class="best-header">
          <div class="best-header-left">
            <span class="best-badge">
              <svg viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.957a1 1 0 00.95.69h4.162c.969 0 1.371 1.24.588 1.81l-3.37 2.448a1 1 0 00-.364 1.118l1.287 3.957c.3.921-.755 1.688-1.54 1.118l-3.37-2.448a1 1 0 00-1.175 0l-3.37 2.448c-.784.57-1.838-.197-1.539-1.118l1.287-3.957a1 1 0 00-.364-1.118L2.075 9.384c-.783-.57-.38-1.81.588-1.81h4.162a1 1 0 00.95-.69L9.05 2.927z"/></svg>
              Best Answer
            </span>
            <span class="best-provider-tag">${esc(v.winner_label)}</span>
          </div>
          <div class="best-actions">
            <button class="btn-icon" id="copy-best">${iconCopy} Copy</button>
            <button class="btn-icon" id="export-md">${iconMd} .md</button>
            <button class="btn-icon" id="export-pdf">${iconPdf} PDF</button>
          </div>
        </div>
        <div class="best-question">${esc(data.question)}</div>
        <div class="best-body md-body">${renderMd(data.best_answer)}</div>
        <div class="rationale">
          <strong>Why this won:</strong> ${esc(v.rationale)}${judgeNote}
        </div>
      </div>` +

      data.answers.map((a, idx) => {
        const isWinner = a.is_winner, isError = !!a.error;
        const score = data.verdict.scores?.[a.provider];
        const badge = isWinner
          ? `<span class="badge badge-winner">Winner</span>`
          : isError
          ? `<span class="badge badge-error">Error</span>`
          : `<span class="badge badge-candidate">Candidate</span>`;
        const scoreBadge = score != null ? `<span class="score-tag">${score}/10</span>` : "";
        const body = isError
          ? `<div class="card-body is-error">⚠ ${esc(a.error)}</div>`
          : `<div class="card-body">
               <button class="btn-icon card-copy" data-idx="${idx}">${iconCopy} Copy</button>
               <div class="card-content md-body">${renderMd(a.answer)}</div>
             </div>`;
        return `
          <details class="provider-card" ${isWinner ? "open" : ""}>
            <summary>
              <div class="summary-left">
                <div>
                  <div class="provider-name">${esc(a.label)}</div>
                  <div class="provider-model">${esc(a.model)}</div>
                </div>
              </div>
              <div class="summary-right">
                <span class="latency">${a.latency_ms} ms</span>
                ${scoreBadge}
                ${badge}
                <svg class="chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M5 8l5 5 5-5"/>
                </svg>
              </div>
            </summary>
            ${body}
          </details>`;
      }).join("");

    // Wire buttons
    document.getElementById("copy-best")?.addEventListener("click", function() {
      copyText(data.best_answer, this);
    });
    document.getElementById("export-md")?.addEventListener("click", () => exportMarkdown(data));
    document.getElementById("export-pdf")?.addEventListener("click", () => window.print());
    document.querySelectorAll(".card-copy").forEach(btn => {
      btn.addEventListener("click", function() {
        copyText(data.answers[+this.dataset.idx].answer, this);
      });
    });
  }

  // ── Ask ──
  async function ask() {
    const question = q.value.trim();
    if (!question) { q.focus(); return; }
    toast.innerHTML = "";
    addHist(question);
    setLoading(true);
    try {
      const r = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await r.json();
      if (!r.ok) {
        results.innerHTML = "";
        toast.innerHTML = `<div class="toast">⚠ ${esc(data.detail || "Request failed.")}</div>`;
        return;
      }
      renderResponse(data);
    } catch (e) {
      results.innerHTML = "";
      toast.innerHTML = `<div class="toast">⚠ ${esc(String(e))}</div>`;
    } finally { setLoading(false); }
  }

  askBtn.addEventListener("click", ask);
  q.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") ask(); });
  loadHealth();
</script>
</body>
</html>
